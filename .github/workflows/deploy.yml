name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一次部署
concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      size_json: ${{ steps.size_summary.outputs.json }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify lockfile is in sync with package.json
        id: lockfile
        run: npm ci --dry-run

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Type Check
        id: typecheck
        run: npm run typecheck

      - name: Lint
        id: lint
        run: npm run lint

      - name: Build
        id: build
        run: npm run build

      - name: Bundle Size Check
        id: size
        run: |
          set -o pipefail
          node scripts/check-bundle-size.js | tee /tmp/size-report.txt

      - name: 提取体积摘要
        id: size_summary
        if: always()
        run: |
          json=$(grep -o 'SIZE_JSON:.*' /tmp/size-report.txt | tail -n 1 | sed 's/^SIZE_JSON://')
          echo "json=$json" >> "$GITHUB_OUTPUT"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  lighthouse:
    name: Lighthouse Audit
    needs: deploy
    runs-on: ubuntu-latest
    # Lighthouse 失败不阻塞部署，只产出报告
    continue-on-error: true
    outputs:
      scores: ${{ steps.lh_summary.outputs.scores }}
      report_links: ${{ steps.lh_summary.outputs.report_links }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Wait for site to be live
        run: sleep 30

      - name: 生成 Lighthouse 页面清单与配置
        run: node scripts/gen-lighthouse-pages.mjs

      - name: Run Lighthouse CI
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ./.github/lighthouse/lighthouserc.generated.json

      - name: 提取分数与报告链接
        id: lh_summary
        if: always()
        env:
          RESULTS_PATH: ${{ steps.lhci.outputs.resultsPath }}
          LINKS: ${{ steps.lhci.outputs.links }}
        run: |
          set -euo pipefail
          RP="${RESULTS_PATH:-}"
          LINKS_JSON="${LINKS:-}"

          # 读取由 gen-lighthouse-pages.mjs 生成的页面清单（标签 + URL）
          PAGES_JSON='[]'
          if [ -f .github/lighthouse/pages.json ]; then
            PAGES_JSON=$(cat .github/lighthouse/pages.json 2>/dev/null || printf '[]')
          fi

          score_entries=()
          link_entries=()
          n=$(printf '%s' "$PAGES_JSON" | jq 'length' 2>/dev/null || echo 0)
          i=0
          while [ "$i" -lt "$n" ]; do
            entry=$(printf '%s' "$PAGES_JSON" | jq -c ".[$i]" 2>/dev/null || true)
            i=$((i + 1))
            if [ -z "$entry" ]; then continue; fi
            label=$(printf '%s' "$entry" | jq -r '.label // empty' 2>/dev/null || true)
            url=$(printf '%s' "$entry" | jq -r '.url // empty' 2>/dev/null || true)
            if [ -z "$label" ] || [ -z "$url" ]; then continue; fi

            # 1) 找到对应页面的 Lighthouse 报告文件，提取分数（按 requestedUrl 精确匹配）
            f=''
            if [ -n "$RP" ] && [ -d "$RP" ]; then
              f=$(grep -lE "\"requestedUrl\": ?\"$url\"" "$RP"/*.json 2>/dev/null | head -n 1 || true)
              if [ -z "$f" ]; then
                f=$(find "$RP" -maxdepth 1 -name 'lhr-*.json' 2>/dev/null | head -n 1 || true)
              fi
            fi
            sc='null'
            if [ -n "$f" ]; then
              echo "使用报告($label): $f"
              sc=$(jq -c '{
                performance: (.categories.performance.score // 0),
                accessibility: (.categories.accessibility.score // 0),
                "best-practices": (.categories["best-practices"].score // 0),
                seo: (.categories.seo.score // 0)
              }' "$f" 2>/dev/null || printf 'null')
            fi
            score_entries+=("$(jq -nc --arg label "$label" --argjson sc "$sc" '{label:$label, scores:$sc}')")

            # 2) 找到对应页面的报告链接（按 URL 匹配，容忍末尾斜杠差异）
            link=''
            if [ -n "$LINKS_JSON" ]; then
              link=$(printf '%s' "$LINKS_JSON" | jq -r --arg u "$url" '
                to_entries[]
                | select((.key | gsub("/+$";"")) == ($u | gsub("/+$";"")))
                | .value' 2>/dev/null | head -n 1 || true)
              if [ -z "$link" ]; then
                link=$(printf '%s' "$LINKS_JSON" | jq -r 'to_entries[0].value // empty' 2>/dev/null || true)
              fi
            fi
            link_entries+=("$(jq -nc --arg label "$label" --arg url "$link" '{label:$label, url:$url}')")
          done

          scores_json=$(printf '%s\n' "${score_entries[@]}" | jq -sc '.')
          links_json=$(printf '%s\n' "${link_entries[@]}" | jq -sc '.')
          echo "scores=$scores_json" >> "$GITHUB_OUTPUT"
          echo "report_links=$links_json" >> "$GITHUB_OUTPUT"

  notify:
    name: Feishu 通知
    needs: [build, deploy, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: 发送飞书通知
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SIZE_JSON: ${{ needs.build.outputs.size_json }}
          LH_SCORES: ${{ needs.lighthouse.outputs.scores }}
          LH_REPORT_LINKS: ${{ needs.lighthouse.outputs.report_links }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          site='https://blog.bobhuang.cn'
          short_sha="${GITHUB_SHA::8}"

          if [ "$BUILD_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ]; then
            export FEISHU_TITLE="🚀 部署成功 · $site"
            export FEISHU_COLOR=green
            lines=("**版本**：\`$short_sha\`　**分支**：\`$GITHUB_REF_NAME\`　**触发者**：\`$GITHUB_ACTOR\`")

            if [ -n "$SIZE_JSON" ]; then
              critical=$(printf '%s' "$SIZE_JSON" | jq -r '.criticalJsKB // "?"')
              total=$(printf '%s' "$SIZE_JSON" | jq -r '.totalJsKB // "?"')
              css=$(printf '%s' "$SIZE_JSON" | jq -r '.totalCssKB // "?"')
              lines+=("**体积（gzip）**：首屏 JS ${critical} KB · JS 总计 ${total} KB · CSS 总计 ${css} KB")
            fi

            if [ -n "$LH_SCORES" ]; then
              n=$(printf '%s' "$LH_SCORES" | jq 'length' 2>/dev/null || echo 0)
              i=0
              while [ "$i" -lt "$n" ]; do
                entry=$(printf '%s' "$LH_SCORES" | jq -c ".[$i]" 2>/dev/null || true)
                i=$((i + 1))
                if [ -z "$entry" ]; then continue; fi
                label=$(printf '%s' "$entry" | jq -r '.label // empty' 2>/dev/null || true)
                sc=$(printf '%s' "$entry" | jq -c '.scores // null' 2>/dev/null || true)
                if [ -z "$label" ]; then continue; fi
                if [ "$sc" = "null" ]; then continue; fi
                vals=$(printf '%s' "$sc" | jq -r '[.performance, .accessibility, .["best-practices"], .seo] | map((. // 0) * 100 | round | tostring) | join(" ")' 2>/dev/null || true)
                if [ -z "$vals" ]; then continue; fi
                read -r p a bp seo <<<"$vals"
                lines+=("**Lighthouse（$label）**：性能 $p · 无障碍 $a · 最佳实践 $bp · SEO $seo")
              done
            fi
            if [ -n "$LH_REPORT_LINKS" ]; then
              n=$(printf '%s' "$LH_REPORT_LINKS" | jq 'length' 2>/dev/null || echo 0)
              parts=''
              i=0
              while [ "$i" -lt "$n" ]; do
                entry=$(printf '%s' "$LH_REPORT_LINKS" | jq -c ".[$i]" 2>/dev/null || true)
                i=$((i + 1))
                if [ -z "$entry" ]; then continue; fi
                label=$(printf '%s' "$entry" | jq -r '.label // empty' 2>/dev/null || true)
                url=$(printf '%s' "$entry" | jq -r '.url // empty' 2>/dev/null || true)
                if [ -z "$url" ]; then continue; fi
                if [ -z "$parts" ]; then
                  parts="[📊 $label]($url)"
                else
                  parts="$parts · [📊 $label]($url)"
                fi
              done
              [ -n "$parts" ] && lines+=("$parts")
            fi

            export FEISHU_BODY="$(printf '%s\n' "${lines[@]}")"
            export FEISHU_BUTTONS_JSON="$(jq -nc --arg site "$site" --arg run "$RUN_URL" \
              '[{"text":"访问站点","url":$site},{"text":"查看运行","url":$run,"type":"default"}]')"
          else
            failed=''
            [ "$BUILD_RESULT" != success ] && failed='Build'
            [ "$DEPLOY_RESULT" != success ] && failed="${failed:+$failed、}Deploy"
            export FEISHU_TITLE="🚨 部署失败 · $site"
            export FEISHU_COLOR=red
            export FEISHU_BODY="$(printf '%s\n' \
              "**失败阶段**：${failed:-未知}" \
              "**版本**：\`$short_sha\`　**分支**：\`$GITHUB_REF_NAME\`　**触发者**：\`$GITHUB_ACTOR\`" \
              "**时间**：$(date -u -d '+8 hours' '+%F %T')（北京时间）")"
            export FEISHU_BUTTONS_JSON="$(jq -nc --arg run "$RUN_URL" '[{"text":"查看日志","url":$run}]')"
          fi

          node .github/scripts/feishu-notify.mjs
